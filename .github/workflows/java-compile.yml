name: Java compile

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: Compile (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '21']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile Java 11-compatible source
        working-directory: LittleFarm
        run: |
          mkdir -p out
          javac --release 11 -encoding UTF-8 -d out src/*.java
